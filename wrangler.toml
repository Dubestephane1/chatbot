# Cloudflare Workers static assets config.
# Serves the ENTIRE repo root as static assets (chatbot.js, chatbot.css,
# data/, theme/, demo/, _redirects) so every file is reachable at:
#   https://chatbot.stephanedube.dev/<path>
name = "chatbot"
compatibility_date = "2026-09-14"

[assets]
directory = "."